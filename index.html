<!doctype html>
<html lang="en">
  <head>
    <!-- UTF-8 lets names and movie titles use ordinary international text. -->
    <meta charset="UTF-8" />
    <!-- Match the layout width to the device without disabling browser zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- This is the browser tab title, separate from the page heading in React. -->
    <title>Lab 7 | React</title>
  </head>
  <body>
    <!-- React mounts its shared layout inside this otherwise empty element. -->
    <div id="root"></div>
    <!-- Vite follows this module entry to load our components and styles. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
